version: "3.8"

networks:
  ap-net:
    driver: bridge

volumes:
  mysql-data:
    driver: local

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ap-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ApMysql2026
      MYSQL_DATABASE: account_permission
      MYSQL_USER: ap_user
      MYSQL_PASSWORD: ApPass2026
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "13306:3306"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - ap-net

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ap-backend
    restart: unless-stopped
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=ap_user
      - MYSQL_PASSWORD=ApPass2026
      - MYSQL_DATABASE=account_permission
      - SECRET_KEY=ap-secret-key-for-jwt-token-min-32
      - JWT_SECRET_KEY=ap-jwt-secret-key-for-account-permission
    ports:
      - "18000:8000"
    depends_on:
      - mysql
    networks:
      - ap-net

  # Vue3 Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ap-frontend
    restart: unless-stopped
    ports:
      - "18080:80"
    depends_on:
      - backend
    networks:
      - ap-net
